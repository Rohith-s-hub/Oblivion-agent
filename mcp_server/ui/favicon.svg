<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="violet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0a0a0f"/>
  <circle cx="50" cy="50" r="30" fill="url(#glow)"/>
  <!-- Outer Ring -->
  <path d="M 50 15 C 30 15 20 35 20 50 C 20 65 30 85 50 85 C 70 85 80 65 80 50 C 80 35 70 15 50 15 Z" 
        fill="none" stroke="url(#violet-cyan)" stroke-width="6" stroke-linecap="round"/>
  <!-- Inner Circle Void -->
  <circle cx="50" cy="50" r="16" fill="#0a0a0f"/>
  <!-- Center Glow Dot -->
  <circle cx="50" cy="50" r="4" fill="#c4b5fd"/>
  <!-- Vertical Beam -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#f5f3ff" stroke-width="2.5" stroke-linecap="round"/>
</svg>